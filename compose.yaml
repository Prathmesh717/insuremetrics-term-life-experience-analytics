services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: life_experience
      POSTGRES_USER: actuarial
      POSTGRES_PASSWORD: actuarial_dev
    ports:
      - "5432:5432"
    volumes:
      - life_experience_pgdata:/var/lib/postgresql/data
      - ./data/generated:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actuarial -d life_experience"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  life_experience_pgdata:

